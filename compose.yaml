name: gobike

services:
  db:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: gobike-db
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${GOBIKE_SA_PASSWORD:?Set GOBIKE_SA_PASSWORD in .env}
    ports:
      - "14330:1433"
    volumes:
      - gobike_sql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  db-init:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: gobike-db-init
    depends_on:
      db:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${GOBIKE_SA_PASSWORD:?Set GOBIKE_SA_PASSWORD in .env}
    volumes:
      - ./gobikedb.sql:/scripts/gobikedb.sql:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        SQLCMD=/opt/mssql-tools18/bin/sqlcmd
        if $$SQLCMD -S db -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -Q "IF DB_ID(N'GoBikeDB') IS NULL THROW 50000, 'Database missing', 1;"; then
          echo "GoBikeDB already exists; skipping initial import."
        else
          echo "Creating and seeding GoBikeDB..."
          $$SQLCMD -S db -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -f 65001 -i /scripts/gobikedb.sql
          $$SQLCMD -S db -U sa -P "$$MSSQL_SA_PASSWORD" -C -b -Q "USE [GoBikeDB]; IF NOT EXISTS (SELECT 1 FROM [__EFMigrationsHistory] WHERE [MigrationId] = N'20260628151733_tenmigration') INSERT INTO [__EFMigrationsHistory] ([MigrationId], [ProductVersion]) VALUES (N'20260628151733_tenmigration', N'10.0.8');"
        fi
    restart: "no"

  api:
    build:
      context: .
      dockerfile: API/Dockerfile
    image: gobike-api:local
    container_name: gobike-api
    restart: unless-stopped
    depends_on:
      db-init:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Server=db,1433;Database=GoBikeDB;User Id=sa;Password=${GOBIKE_SA_PASSWORD};Encrypt=False;TrustServerCertificate=True
      MapProviders__OpenRouteService__ApiKey: ${OPENROUTESERVICE_API_KEY:?Set OPENROUTESERVICE_API_KEY in .env}
      AI__Ollama__BaseUrl: http://host.docker.internal:11434/
      AI__Ollama__Model: qwen3:0.6b
    ports:
      - "5210:8080"
    volumes:
      - gobike_api_keys:/root/.aspnet/DataProtection-Keys
    extra_hosts:
      - "host.docker.internal:host-gateway"

  webui:
    build:
      context: .
      dockerfile: WebUI/Dockerfile
    image: gobike-webui:local
    container_name: gobike-webui
    restart: unless-stopped
    depends_on:
      - api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ApiSettings__BaseUrl: http://api:8080
      ApiSettings__TimeoutSeconds: 180
      MapProviders__MapTiler__ApiKey: ${MAPTILER_API_KEY:?Set MAPTILER_API_KEY in .env}
    ports:
      - "5208:8080"
    volumes:
      - gobike_web_uploads:/app/wwwroot/uploads
      - gobike_web_keys:/root/.aspnet/DataProtection-Keys

volumes:
  gobike_sql_data:
  gobike_api_keys:
  gobike_web_uploads:
  gobike_web_keys:
